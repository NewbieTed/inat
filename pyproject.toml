[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inat"
version = "0.1.0"
description = "Local-first internship application tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
vectors = [
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=5.0",
    "sqlite-vec>=0.1.6,<0.2",
    "torch>=2.6,<2.9",
]
dev = ["pytest>=8.0"]

[project.scripts]
inat = "inat.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inat.infrastructure" = ["sql/*.sql", "sql/migrations/*.sql", "sql/queries/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

